<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urban Visual Representations — Pilot Study</title>
<style>
:root{
  --bg:#f3f7fc; --panel:#ffffffeb; --border:#dfe7f1; --text:#152033;
  --muted:#66758b; --accent:#2f6fed; --shadow:0 12px 38px rgba(28,46,76,.10);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--text)}
body{
  background:
    radial-gradient(circle at 0 0,#dbeafe 0,transparent 28%),
    radial-gradient(circle at 100% 0,#d9f7ed 0,transparent 22%),
    linear-gradient(180deg,#f8fbff,#edf3f9);
  overflow:hidden;
}
.app{height:100vh;padding:14px;display:grid;grid-template-columns:340px minmax(0,1fr) 330px;gap:14px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);min-width:0}
.left{
  overflow-y:auto;overflow-x:hidden;padding:0 20px 22px;
  scrollbar-gutter:stable;
}
.left-sticky{
  position:sticky;top:0;z-index:5;margin:0 -20px;padding:20px 20px 12px;
  background:linear-gradient(180deg,#fff 78%,rgba(255,255,255,.94) 90%,rgba(255,255,255,0));
}
.lang{display:flex;gap:5px;float:right}
.lang button{height:32px;min-width:42px;padding:0 10px}
.badge{display:inline-flex;border:1px solid #c9dcff;background:#eef5ff;color:#2f6fed;border-radius:999px;padding:7px 11px;font-size:11px;font-weight:800;letter-spacing:.08em}
h1{font-size:37px;line-height:1.0;letter-spacing:-.045em;margin:12px 0 10px}
.copy{font-size:14px;line-height:1.55;color:var(--muted);margin:0}
.method{margin-top:12px;padding:12px;border-radius:16px;background:#f7f9fc;border:1px solid var(--border);font-size:12px;line-height:1.5;color:#627087}
.section{margin-top:20px}
.section-title{font-size:11px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:#607087;margin-bottom:9px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--border);border-radius:999px;background:#fff;padding:7px 10px;font-size:12px;font-weight:650}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{border:1px solid var(--border);border-radius:17px;padding:14px;background:#fff}
.stat b{display:block;font-size:25px}.stat span{font-size:10px;color:#718096;font-weight:850;letter-spacing:.06em}
.legend-row{display:flex;align-items:center;gap:9px;margin:8px 0;color:var(--muted);font-size:12px}
.dot{width:13px;height:13px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px #0002}

.main{min-width:0;display:flex;flex-direction:column;gap:12px}
.controls{padding:12px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.group{display:flex;align-items:center;gap:6px}
.group label{font-size:11px;color:#65758a;font-weight:800;letter-spacing:.04em}
select,button{
  border:1px solid var(--border);border-radius:999px;background:#fff;color:var(--text);
  height:37px;padding:0 12px;font-size:13px;max-width:190px
}
button{font-weight:750;cursor:pointer}
button.primary{background:#eaf2ff;border-color:#bfd5ff;color:#2458aa}
.canvas{flex:1;min-height:0;position:relative;overflow:hidden}
#svg{width:100%;height:100%;display:block;cursor:grab;background:linear-gradient(180deg,#fff,#f7fafe)}
#svg.dragging{cursor:grabbing}
.edge{stroke:#7187a7;stroke-opacity:.18;stroke-width:1.05}
.edge.strong{stroke-opacity:.34;stroke-width:1.4}
.edge.cross{stroke:#546d98;stroke-opacity:.44;stroke-width:1.55}
.edge.dim{stroke-opacity:.035}
.node-group.hidden{display:none}
.node-group.dim{opacity:.12}
.ring{fill:white;stroke-width:4;filter:drop-shadow(0 3px 7px rgba(23,35,58,.10))}
.node-group.selected .ring{stroke-width:6}
.node-group.neighbor .ring{stroke-width:5}
.hit{fill:transparent;cursor:pointer}
.caption{
  position:absolute;left:16px;bottom:15px;padding:9px 13px;border-radius:999px;
  background:#fffffff0;border:1px solid var(--border);color:#66758b;font-size:12px;box-shadow:var(--shadow)
}

.right{overflow:hidden;padding:18px;display:flex;flex-direction:column}
.right-title{font-size:11px;font-weight:850;letter-spacing:.08em;color:#607087;text-transform:uppercase;margin-bottom:10px}
#info{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:4px;
  scrollbar-gutter:stable;min-width:0
}
.hero{width:100%;max-height:340px;object-fit:contain;background:#f3f6fa;border:1px solid var(--border);border-radius:18px;display:block}
.city-name{font-size:28px;font-weight:850;line-height:1.05;letter-spacing:-.035em;margin:14px 0 4px;overflow-wrap:anywhere}
.loc{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px;min-width:0}
.meta{border:1px solid var(--border);border-radius:15px;padding:11px;background:#fff;min-width:0}
.meta-k{font-size:10px;color:#718096;font-weight:850;letter-spacing:.06em;text-transform:uppercase}
.meta-v{font-size:13px;font-weight:750;margin-top:4px;overflow-wrap:anywhere;word-break:break-word;min-width:0}
.neighbors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:9px}
.neighbors img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:11px;border:1px solid var(--border);cursor:pointer}
details{margin-top:13px;border-top:1px solid var(--border);padding-top:10px;min-width:0}
details summary{font-size:12px;font-weight:800;color:#65758a;cursor:pointer}
.prov{font-size:11px;line-height:1.5;color:#718096;margin-top:8px;overflow-wrap:anywhere;word-break:break-word}
.prov a{color:#2f6fed}
.empty{padding:24px 8px;color:var(--muted);font-size:14px;line-height:1.55}

.diag-table{width:100%;border-collapse:collapse;font-size:11px;color:#58677b}
.diag-table th,.diag-table td{border-bottom:1px solid #e7edf4;padding:6px 3px;text-align:right}
.diag-table th:first-child,.diag-table td:first-child{text-align:left}

@media(max-width:1150px){
  body{overflow:auto}.app{height:auto;min-height:100vh;grid-template-columns:1fr;grid-template-rows:auto minmax(650px,80vh) auto}
  .left{max-height:500px}.right{min-height:600px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="panel left">
    <div class="left-sticky">
      <div class="lang"><button id="ruBtn">RU</button><button id="enBtn">EN</button></div>
      <span class="badge" data-i18n="study_badge"></span>
      <h1 data-i18n="title"></h1>
    </div>
    <p class="copy" data-i18n="subtitle"></p>
    <div class="method" data-i18n="method_note"></div>

    <div class="section">
      <div class="section-title" data-i18n="cities"></div>
      <div class="chips" id="cityChips"></div>
    </div>

    <div class="section stats">
      <div class="stat"><b>183</b><span data-i18n="photos"></span></div>
      <div class="stat"><b>617</b><span data-i18n="relations"></span></div>
      <div class="stat"><b>5</b><span data-i18n="clusters"></span></div>
      <div class="stat"><b>3</b><span data-i18n="cities_stat"></span></div>
    </div>

    <div class="section">
      <div class="section-title" data-i18n="how_to"></div>
      <p class="copy" data-i18n="how_text"></p>
    </div>

    <div class="section">
      <div class="section-title" data-i18n="legend"></div>
      <div id="legend"></div>
    </div>

    <div class="section">
      <div class="section-title" data-i18n="diagnostics"></div>
      <p class="copy" style="font-size:12px;margin-bottom:8px" data-i18n="diag_text"></p>
      <div style="overflow-x:auto"><table class="diag-table" id="diagTable"></table></div>
    </div>
  </aside>

  <main class="main">
    <div class="panel controls">
      <div class="group"><label data-i18n="city"></label><select id="citySel"></select></div>
      <div class="group"><label data-i18n="location"></label><select id="zoneSel"></select></div>
      <div class="group"><label data-i18n="cluster"></label><select id="clusterSel"></select></div>
      <div class="group"><label data-i18n="color_by"></label><select id="colorSel"></select></div>
      <div class="group"><label data-i18n="edges"></label><select id="edgeSel"></select></div>
      <button class="primary" id="fitBtn" data-i18n="fit"></button>
      <button id="resetBtn" data-i18n="reset"></button>
    </div>
    <div class="panel canvas">
      <svg id="svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid meet">
        <g id="viewport"><g id="edgesLayer"></g><g id="nodesLayer"></g></g>
      </svg>
      <div class="caption" data-i18n="drag"></div>
    </div>
  </main>

  <aside class="panel right">
    <div class="right-title" data-i18n="selected"></div>
    <div id="info"></div>
  </aside>
</div>

r han opprinnelig kom fra. Her virket han som korrespondent for Dagbladet i Vest-Norge.", "license": "CC BY 2.0", "commons_page": "https://commons.wikimedia.org/wiki/File:Gateliv_i_Sovjetunionen_-_Gravferd_(1935)_(10421771906).jpg", "filename": "saint_petersburg_0018_66368186.jpg", "thumb": "thumbs/thumb_0018.jpg", "preview": "previews/preview_0018.jpg", "cross_rate": 1.0, "px": 644.3922729492188, "py": 118.6722412109375, "cluster_color": "#EC4899", "city_color": "#3B82F6"}, {"id": 19, "city": "saint_petersburg", "city_ru": "Санкт-Петербург", "city_en": "Saint Petersburg", "zone": "vasilevsky_west", "zone_ru": "Васильевский остров / запад", "zone_en": "Vasilyevsky Island / west", "cluster": 4, "author": "Макарова Элеонора", "commons_title": "File:Развод Мостов.jpg", "description": "Санкт-Петербург, Дворцовый мост", "license": "CC BY-SA 4.0", "commons_page": "https://commons.wikimedia.org/wiki/File:Развод_Мостов.jpg", "filename": "saint_petersburg_0019_43105353.jpg", "thumb": "thumbs/thumb_0019.jpg", "preview": "previews/preview_0019.jpg", "cross_rate": 0.8, "px": 833.8309326171875, "py": 312.40771484375, "cluster_color": "#EC4899", "city_color": "#3B82F6"}, {"id": 20, "city": "saint_petersburg", "city_ru": "Санкт-Петербург", "city_en": "Saint Petersburg", "zone": "petrograd_north", "zone_ru": "Петроградская сторона / север", "zone_en": "Petrograd Side / north", "cluster": 0, "author": "Lion10~commonswiki", "commons_title": "File:Здание химической лаборатории с фонтаном.jpg", "description": "Институт экспериментальной медицины: улица Академика Павлова, 9, 12, Петроградский район, Санкт-Петербург", "license": "CC BY-SA 4.0", "commons_page": "https://commons.wikimedia.org/wiki/File:Здание_химической_лаборатории_с_фонтаном.jpg", "filename": "saint_petersburg_0020_95369319.jpg", "thumb": "thumbs/thumb_0020.jpg", "preview": "previews/preview_0020.jpg", "cross_rate": 0.1, "px": 175.54345703125, "py": 658.453369140625, "cluster_color": "#3B82F6", "city_color": "#3B82F6"}, { dica.JPG", "description": "Polu-siluete...", "license": "CC BY-SA 3.0", "commons_page": "https://commons.wikimedia.org/wiki/File:Porodica.JPG", "filename": "novi_sad_0181_21603931.jpg", "thumb": "thumbs/thumb_0181.jpg", "preview": "previews/preview_0181.jpg", "cross_rate": 0.2, "px": 194.07235717773438, "py": 751.9619140625, "cluster_color": "#3B82F6", "city_color": "#10B981"}, {"id": 182, "city": "novi_sad", "city_ru": "Нови-Сад", "city_en": "Novi Sad", "zone": "petrovaradin", "zone_ru": "Петроварадин", "zone_en": "Petrovaradin", "cluster": 0, "author": "BojanPavlukovic", "commons_title": "File:Gornja i donja Petrovaradinska tvrđava sa podgrađem - Petrovaradin Fortress 08.jpg", "description": "The Petrovaradin Fortress, often called the “Gibraltar on the Danube,” is one of the most impressive fortification complexes in this part of Europe. Its construction lasted from 1692 to 1780, built by the Austrians to strengthen their defense against the Ottoman Empire. The fortress stretches along the banks of the Danube and dominates the panorama of Novi Sad. It is especially famous for its vast network of underground tunnels and its large clock tower, whose hands are reversed – the large hand shows the hours and the small one the minutes – so that the time could be read from the river. Today, Petrovaradin Fortress is one of the most visited tourist attractions in Serbia. It houses galleries, studios, restaurants, and the famous EXIT music festival, making it a vibrant center of culture, art, and entertainment.", "license": "CC BY-SA 4.0", "commons_page": "https://commons.wikimedia.org/wiki/File:Gornja_i_donja_Petrovaradinska_tvrđava_sa_podgrađem_-_Petrovaradin_Fortress_08.jpg", "filename": "novi_sad_0182_175433567.jpg", "thumb": "thumbs/thumb_0182.jpg", "preview": "previews/preview_0182.jpg", "cross_rate": 0.3, "px": 293.6255798339844, "py": 429.7226867675781, "cluster_color": "#3B82F6", "city_color": "#10B981"}];

function renderLegend(){
  const box=document.getElementById("legend");box.innerHTML="";
  let items=[];
  if(state.color==="city"){
    [...new Set(NODES.map(n=>n.city))].sort().forEach(c=>{
      const n=NODES.find(x=>x.city===c);items.push([cityName(n),CITY_COLOR[c]])
    })
  }else{
    [...new Set(NODES.map(n=>n.cluster))].sort((a,b)=>a-b).forEach(c=>{
      items.push([c===-1?t("unclustered"):`${t("cluster")} ${c}`,CLUSTER_COLOR[String(c)]])

  items.forEach(([label,col])=>{
    const r=document.createElement("div");r.className="legend-row";
    r.innerHTML=`<span class="dot" style="background:${col}"></span><span>${label}</span>`;box.appendChild(r)

    im.setAttribute("href",n.thumb);im.setAttribute("x",n.px-16);im.setAttribute("y",n.py-16);im.setAttribute("width",32);im.setAttribute("height",32);
    im.setAttribute("clip-path",`url(#c${n.id})`);im.setAttribute("preserveAspectRatio","xMidYMid slice");

    const hit=document.createElementNS("http://www.w3.org/2000/svg","circle");
    hit.setAttribute("class","hit");hit.setAttribute("cx",n.px);hit.setAttribute("cy",n.py);hit.setAttribute("r",22);
    hit.onclick=ev=>{ev.stopPropagation();state.selected=n.id;renderAll(false);focus(n.id)};

    g.appendChild(r);g.appendChild(im);g.appendChild(hit);nodesLayer.appendChild(g)
  });
  renderInfo(sel)
}

function renderAll(refit){
  renderLegend();renderGraph();if(refit)fit();else applyTransform()
}
function focus(id){
  const n=byId.get(id);state.scale=1.55;state.tx=1200/2-n.px*state.scale;state.ty=900/2-n.py*state.scale;applyTransform()
}

citySel.onchange=()=>{state.city=citySel.value;state.selected=null;renderAll(true)};
zoneSel.onchange=()=>{state.zone=zoneSel.value;state.selected=null;renderAll(true)};
clusterSel.onchange=()=>{state.cluster=clusterSel.value;state.selected=null;renderAll(true)};
colorSel.onchange=()=>{state.color=colorSel.value;renderAll(false)};
edgeSel.onchange=()=>{state.edges=edgeSel.value;renderAll(false)};
document.getElementById("fitBtn").onclick=fit;
document.getElementById("resetBtn").onclick=()=>{
  Object.assign(state,{city:"*",zone:"*",cluster:"*",color:"cluster",edges:"strong",selected:null});
  rebuildControls();renderAll(true)
};
document.getElementById("ruBtn").onclick=()=>{lang="ru";applyI18n()};
document.getElementById("enBtn").onclick=()=>{lang="en";applyI18n()};

let dragging=false,sx=0,sy=0,otx=0,oty=0;
svg.onmousedown=e=>{dragging=true;svg.classList.add("dragging");sx=e.clientX;sy=e.clientY;otx=state.tx;oty=state.ty};
window.onmousemove=e=>{if(!dragging)return;state.tx=otx+e.clientX-sx;state.ty=oty+e.clientY-sy;applyTransform()};
window.onmouseup=()=>{dragging=false;svg.classList.remove("dragging")};
svg.onwheel=e=>{
  e.preventDefault();const rect=svg.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(1200/rect.width),my=(e.clientY-rect.top)*(900/rect.height);
  const f=e.deltaY<0?1.12:.9,ns=Math.max(.5,Math.min(3.8,state.scale*f));
  const wx=(mx-state.tx)/state.scale,wy=(my-state.ty)/state.scale;
  state.tx=mx-wx*ns;state.ty=my-wy*ns;state.scale=ns;applyTransform()
};
svg.onclick=e=>{if(e.target===svg){state.selected=null;renderAll(false)}};

applyI18n();fit();renderAll(false);
</script>
</body>
</html>
